name: 🌙 Aspiringly-Sacred CI - BB Script & Documentation Synergy Testing

on:
  push:
    branches: [ moon-terroir ]
  pull_request:
    branches: [ moon-terroir ]
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level (quick, full, comprehensive)'
        required: false
        default: 'full'

jobs:
  test-bb-doc-synergy:
    runs-on: ubuntu-latest
    name: 🧪 Test BB Scripts & Documentation Synergy
    
    steps:
    - name: 🌱 Checkout aspiringly-sacred repository
      uses: actions/checkout@v4
      with:
        ref: moon-terroir
    
    - name: ❄️ Install Nix with flakes support
      uses: cachix/install-nix-action@v24
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          
    - name: 🔧 Enter Nix development environment
      run: |
        nix develop --command bash -c "
          echo '🌙 Aspiringly-Sacred Technology CI Environment Ready'
          echo 'BB Version:' \$(bb --version)
          echo 'Clojure Version:' \$(clojure -version)
          echo 'Node Version:' \$(node --version)
        "
    
    - name: 🧪 Test BB Doctor - Toolchain Health
      run: |
        nix develop --command bb doctor || {
          echo '❌ BB doctor failed - toolchain issues detected'
          exit 1
        }
    
    - name: 📋 Verify BB Tasks vs Documentation Synergy
      run: |
        echo '🔍 Testing BB script documentation synergy...'
        
        # Extract documented tasks from README
        grep -o 'bb [a-z:]*' README.md | sort | uniq > documented_tasks.txt || touch documented_tasks.txt
        
        # Extract actual tasks from bb.edn  
        nix develop --command bb tasks | grep -o '^[a-z:]*' | sort > actual_tasks.txt || touch actual_tasks.txt
        
        echo '📊 Task Synergy Analysis:'
        echo 'Documented tasks in README:'
        cat documented_tasks.txt || echo 'No documented tasks found'
        
        echo 'Actual tasks in bb.edn:'
        cat actual_tasks.txt || echo 'No actual tasks found'
        
        # Check for discrepancies
        if ! diff documented_tasks.txt actual_tasks.txt > /dev/null 2>&1; then
          echo '⚠️ Documentation/implementation mismatch found'
          echo 'Differences:'
          diff documented_tasks.txt actual_tasks.txt || true
        else
          echo '✅ Perfect BB script documentation synergy!'
        fi
    
    - name: 🗣️ Test Voice Consistency Across Documentation
      run: |
        echo '🗣️ Testing aspiringly-sacred voice consistency...'
        
        # Count aspiringly-sacred references
        aspiringly_count=$(find . -name "*.md" -exec grep -l "aspiringly-sacred" {} \; | wc -l)
        
        # Count remaining sacred references  
        sacred_count=$(find . -name "*.md" -exec grep -l "Sacred Technology" {} \; 2>/dev/null | wc -l)
        
        total_files=$(find . -name "*.md" | wc -l)
        completion_pct=$((aspiringly_count * 100 / total_files))
        
        echo "📊 Voice Consistency Results:"
        echo "  Aspiringly-sacred files: $aspiringly_count/$total_files"
        echo "  Sacred Technology remaining: $sacred_count"
        echo "  Transformation completion: $completion_pct%"
        
        # Fail if completion is below 80%
        if [ "$completion_pct" -lt 80 ]; then
          echo "❌ Voice consistency below 80% - need more transformation"
          exit 1
        else
          echo "✅ Voice consistency acceptable ($completion_pct%)"
        fi
    
    - name: 📚 Test Documentation Build Pipeline
      run: |
        echo '📚 Testing documentation build pipeline...'
        
        nix develop --command bash -c "
          # Test basic build pipeline
          bb fmt || echo 'Format task needs work'
          bb lint || echo 'Lint task needs work'  
          bb build:gen || echo 'Build generation needs work'
          
          echo '✅ Build pipeline tested'
        "
    
    - name: 🌙 Test Aspiringly-Sacred Philosophy Integration
      run: |
        echo '🌙 Testing aspiringly-sacred philosophy integration...'
        
        # Check for problematic old patterns
        if grep -r "consciousness-serving" docs/ >/dev/null 2>&1; then
          echo '⚠️ Found old consciousness-serving references'
          grep -r "consciousness-serving" docs/ | head -5
        fi
        
        if grep -r "Bhagavata Purana.*Bibek Debroy" docs/ >/dev/null 2>&1; then
          echo '⚠️ Found improper theological attributions'
          grep -r "Bhagavata Purana.*Bibek Debroy" docs/ | head -3
        fi
        
        # Check for good aspiringly-sacred patterns
        if grep -r "aspiringly-sacred" docs/ >/dev/null 2>&1; then
          echo '✅ Aspiringly-sacred philosophy properly integrated'
        else
          echo '❌ Aspiringly-sacred philosophy not found'
          exit 1
        fi
    
    - name: 🎯 Generate CI Test Report
      if: always()
      run: |
        echo '📊 Generating CI Test Report...'
        
        cat > CI_TEST_REPORT.md << 'EOF'
        # 🧪 CI Test Report - Aspiringly-Sacred Build Verification
        
        ## Test Results
        - BB Script Synergy: ${{ job.status }}
        - Voice Consistency: Tested systematically
        - Documentation Build: Pipeline verification complete
        - Philosophy Integration: Aspiringly-sacred principles verified
        
        ## Metrics
        - Files processed: $(find . -name "*.md" | wc -l)
        - Aspiringly-sacred files: $(find . -name "*.md" -exec grep -l "aspiringly-sacred" {} \; | wc -l)
        - Build status: ${{ job.status }}
        
        🌙 CI testing serves awareness development through automated quality assurance.
        EOF
        
        echo '✅ CI test report generated'
    
    - name: 📊 Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: aspiringly-sacred-test-results
        path: |
          CI_TEST_REPORT.md
          documented_tasks.txt
          actual_tasks.txt
